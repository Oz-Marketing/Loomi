name: Component tests

# Cypress component suite — one React component at a time, in real Chrome.
# Runbook: docs/component-testing.md.
#
# Deliberately NOT a deploy gate, for the same reason as e2e.yml: branch
# protection requires `verify` (typecheck.yml) and nothing else. No server,
# no database, no build — the suite bundles only the components it mounts.
on:
  pull_request:
  # Pushes to main run too, so a regression that lands there reaches Slack.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_alert:
        # Preview the Slack alert from any branch without breaking a test.
        # Skips the suite and sends a sample card built from made-up results.
        description: Send a sample Slack alert instead of running the tests
        type: choice
        options: [none, failed, flaky, didnt-run]
        default: none

concurrency:
  group: component-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Empty unless this is a manual run with a sample alert picked.
      TEST_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert != 'none' && inputs.test_alert || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: env.TEST_ALERT == ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Installs dependencies AND caches the Cypress browser binary. Like
      # e2e.yml, this is one of the only jobs that needs the binary, so it
      # does NOT set CYPRESS_INSTALL_BINARY=0.
      - name: Install dependencies
        if: env.TEST_ALERT == ''
        uses: cypress-io/github-action@v6
        with:
          runTests: false
          # The repo's peer tree needs this flag — a bare `npm ci` fails.
          install-command: npm ci --legacy-peer-deps

      - name: Typecheck the Cypress suites
        if: env.TEST_ALERT == ''
        # cypress/ is outside the root tsconfig, so `npm run verify` never
        # sees these specs.
        run: npm run verify:e2e

      - name: Run the suite
        if: env.TEST_ALERT == ''
        uses: cypress-io/github-action@v6
        with:
          install: false
          component: true
          browser: chrome

      - name: Upload failure screenshots
        if: failure() && env.TEST_ALERT == ''
        uses: actions/upload-artifact@v4
        with:
          name: component-test-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Slack message
        id: slack
        # Runs after passing runs too: a green run can still have flaky tests.
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || env.TEST_ALERT != '') }}
        env:
          STATUS: ${{ job.status }}
          SUMMARY: cypress/results/component-summary.json
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # cypress.config.ts writes the summary after the run. No file means
          # the job failed before any test ran (install, typecheck, bundling).
          summary=null
          if [ -f "$SUMMARY" ]; then summary="$(cat "$SUMMARY")"; fi

          # A sample alert replaces the run result with made-up data.
          case "$TEST_ALERT" in
            failed)
              STATUS=failure
              summary='{"totalTests": 46, "totalPassed": 44, "totalFailed": 2, "flaky": [], "failures": [
                {"spec": "ui/collapse.cy.tsx", "suite": "Collapse", "test": "opens from zero to full height"},
                {"spec": "ui/tag-input.cy.tsx", "suite": "TagInput", "test": "removes the last tag on Backspace"}]}' ;;
            flaky)
              STATUS=success
              summary='{"totalTests": 46, "totalPassed": 46, "totalFailed": 0, "failures": [], "flaky": [
                {"spec": "select.cy.tsx", "suite": "Select", "test": "closes when clicking outside", "attempts": 2},
                {"spec": "ui/date-picker.cy.tsx", "suite": "DatePicker", "test": "picks a range in either click order", "attempts": 3}]}' ;;
            didnt-run)
              STATUS=failure
              summary=null ;;
          esac

          # Failed → red card. Passed with flaky tests → yellow card.
          # Passed cleanly → nothing, so the channel only ever needs reading.
          flaky="$(jq -n --argjson s "$summary" '$s.flaky // [] | length')"
          if [ "$STATUS" != "failure" ] && [ "$flaky" -eq 0 ]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Everything sits inside the colored card: a large title, stacked
          # "Label: value" lines, the tests as lists, a Test report button and
          # the commit. There is deliberately no top-level `text`, which Slack
          # would render as a line above the card; `fallback` covers
          # notifications instead.
          jq -n \
            --argjson s "$summary" \
            --arg status "$STATUS" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg sha "${GITHUB_SHA::7}" \
            --arg subject "$(git log -1 --format=%s)" \
            --arg actor "$GITHUB_ACTOR" \
            --arg commit_url "$COMMIT_URL" \
            --arg run_url "$RUN_URL" \
            --arg sample "$TEST_ALERT" '
            # mrkdwn treats &, < and > as markup.
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            def clip(n): if length > n then .[:n] + "…" else . end;
            def section(t): {type: "section", text: {type: "mrkdwn", text: t}};
            def name: (if .suite == "" then "" else "*\(.suite | esc)* — " end) + (.test | esc);
            # Capped at 10 so a mass failure stays readable.
            def list(heading; line):
              if length == 0 then []
              else [section("*\(heading)*\n" + (.[:10] | map("- " + line) | join("\n"))
                      + (if length > 10 then "\n…and \(length - 10) more in the report" else "" end))]
              end;

            ($status == "failure") as $failed
            | ($s.failures // []) as $f
            | ($s.flaky // []) as $k
            | (if $s == null then []
               else ["Branch: `\($ref)`", "Triggered by: \($actor)", "Total tests: \($s.totalTests)",
                     "Total passed: \($s.totalPassed // ($s.totalTests - $s.totalFailed))"] end) as $stats
            # Same prefix on every card so they scan as one family, with the
            # count up front: it is what notifications and the channel show.
            # (A curly apostrophe: an ASCII one would end this shell quote.)
            | (if $s == null then "❌ Component tests: didn’t run"
               elif $failed then "❌ Component tests: \($s.totalFailed) failed"
               else "⚠️ Component tests: \($k | length) flaky" end) as $title
            | {
                attachments: [{
                  fallback: "\(if $sample != "" then "[Test] " else "" end)\($title) · \($ref)",
                  # The red and yellow Slack uses for its own alerts.
                  color: (if $failed then "#E01E5A" else "#ECB22E" end),
                  blocks: (
                    [ {type: "header", text: {type: "plain_text", text: $title, emoji: true}} ]
                    + (if $sample != ""
                       then [{type: "context", elements: [{type: "mrkdwn",
                              text: "🧪 *Test alert* with sample data, sent from the Run workflow button. Nothing failed."}]}]
                       else [] end)
                    + (if $s == null
                     then [section("Branch: `\($ref)`\nTriggered by: \($actor)\nInstall, typecheck or bundling failed before the suite started.")]
                     elif $failed
                     then [section(($stats + (if ($k | length) > 0 then ["Flaky: \($k | length)"] else [] end)) | join("\n"))]
                     else [section($stats | join("\n"))]
                     end)
                    + ($f | list("Failed tests"; "\(name)  _(\(.spec))_"))
                    # A flaky test passed on its last attempt, so `attempts` is
                    # the attempt it passed on.
                    + ($k | list("Flaky tests"; "\(name)  _(\(.spec) · passed on attempt \(.attempts))_"))
                    + [ {type: "actions", elements: [
                          {type: "button", text: {type: "plain_text", text: "Test report"}, url: $run_url}]},
                        {type: "context", elements: [
                          {type: "mrkdwn", text: "Commit <\($commit_url)|`\($sha)`> \($subject | clip(60) | esc)"}]} ]
                  )
                }]
              }' > slack-payload.json
          echo "send=true" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || env.TEST_ALERT != '') && steps.slack.outputs.send == 'true' }}
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack-payload.json
