name: Component tests

# Cypress component suite — one React component at a time, in real Chrome.
# Runbook: docs/component-testing.md.
#
# Deliberately NOT a deploy gate, for the same reason as e2e.yml: branch
# protection requires `verify` (typecheck.yml) and nothing else. No server,
# no database, no build — the suite bundles only the components it mounts.
on:
  pull_request:
  # Pushes to main run too, so a regression that lands there reaches Slack.
  push:
    branches: [main, chloe/slack-notify-test]  # TEMP: Slack notify test, never merge
  workflow_dispatch:

concurrency:
  group: component-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Installs dependencies AND caches the Cypress browser binary. Like
      # e2e.yml, this is one of the only jobs that needs the binary, so it
      # does NOT set CYPRESS_INSTALL_BINARY=0.
      - name: Install dependencies
        uses: cypress-io/github-action@v6
        with:
          runTests: false
          # The repo's peer tree needs this flag — a bare `npm ci` fails.
          install-command: npm ci --legacy-peer-deps

      - name: Typecheck the Cypress suites
        # cypress/ is outside the root tsconfig, so `npm run verify` never
        # sees these specs.
        run: npm run verify:e2e

      - name: Run the suite
        uses: cypress-io/github-action@v6
        with:
          install: false
          component: true
          browser: chrome

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Slack message
        id: slack
        if: failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/chloe/slack-notify-test')  # TEMP
        env:
          SUMMARY: cypress/results/component-summary.json
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Slack mrkdwn treats &, < and > as markup, and test titles contain
          # them — `<Collapse>` would otherwise vanish from the message.
          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          subject="$(git log -1 --format=%s | esc)"
          commit="Commit <$COMMIT_URL|\`${GITHUB_SHA::7}\`> \"$subject\" by $GITHUB_ACTOR · <$RUN_URL|view run>"

          # cypress.config.ts writes the summary after the run. No file means
          # the job failed before any test ran (install, typecheck, bundling).
          if [ -f "$SUMMARY" ]; then
            counts="$(jq -r '"(\(.totalFailed) of \(.totalTests))"' "$SUMMARY")"
            # Capped at 10 so a mass failure stays readable; the run has the rest.
            failures="$(jq -r '.failures[:10][] | "• `\(.spec)` — \(.title)"' "$SUMMARY" | esc)"
            extra="$(jq -r '.failures | length - 10' "$SUMMARY")"
            if [ "$extra" -gt 0 ]; then failures="$failures"$'\n'"…and $extra more"; fi
          else
            counts=""
            failures="• Failed before any test ran — see the run log"
          fi

          {
            echo 'text<<SLACK_EOF'
            echo "❌ *Component tests failed on \`$GITHUB_REF_NAME\`* $counts"
            echo "$failures"
            echo "$commit"
            echo 'SLACK_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/chloe/slack-notify-test')  # TEMP
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # toJSON quotes the multi-line text into one valid YAML scalar.
          payload: |
            text: ${{ toJSON(steps.slack.outputs.text) }}
