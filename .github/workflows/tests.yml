name: Component tests

# Cypress component suite — one React component at a time, in real Chrome.
# Runbook: docs/component-testing.md.
#
# Deliberately NOT a deploy gate, for the same reason as e2e.yml: branch
# protection requires `verify` (typecheck.yml) and nothing else. No server,
# no database, no build — the suite bundles only the components it mounts.
on:
  pull_request:
  # Pushes to main run too, so a regression that lands there reaches Slack.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: component-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Installs dependencies AND caches the Cypress browser binary. Like
      # e2e.yml, this is one of the only jobs that needs the binary, so it
      # does NOT set CYPRESS_INSTALL_BINARY=0.
      - name: Install dependencies
        uses: cypress-io/github-action@v6
        with:
          runTests: false
          # The repo's peer tree needs this flag — a bare `npm ci` fails.
          install-command: npm ci --legacy-peer-deps

      - name: Typecheck the Cypress suites
        # cypress/ is outside the root tsconfig, so `npm run verify` never
        # sees these specs.
        run: npm run verify:e2e

      - name: Run the suite
        uses: cypress-io/github-action@v6
        with:
          install: false
          component: true
          browser: chrome

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Slack message
        id: slack
        # Runs after passing runs too: a green run can still have flaky tests.
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          STATUS: ${{ job.status }}
          SUMMARY: cypress/results/component-summary.json
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # cypress.config.ts writes the summary after the run. No file means
          # the job failed before any test ran (install, typecheck, bundling).
          summary=null
          if [ -f "$SUMMARY" ]; then summary="$(cat "$SUMMARY")"; fi

          # Failed → red card. Passed with flaky tests → yellow card.
          # Passed cleanly → nothing, so the channel only ever needs reading.
          flaky="$(jq -n --argjson s "$summary" '$s.flaky // [] | length')"
          if [ "$STATUS" != "failure" ] && [ "$flaky" -eq 0 ]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Everything sits inside the colored card: a large title, stacked
          # "Label: value" lines, the tests as lists, a Test report button and
          # the commit. There is deliberately no top-level `text`, which Slack
          # would render as a line above the card; `fallback` covers
          # notifications instead.
          jq -n \
            --argjson s "$summary" \
            --arg status "$STATUS" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg sha "${GITHUB_SHA::7}" \
            --arg subject "$(git log -1 --format=%s)" \
            --arg actor "$GITHUB_ACTOR" \
            --arg commit_url "$COMMIT_URL" \
            --arg run_url "$RUN_URL" '
            # mrkdwn treats &, < and > as markup.
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            def clip(n): if length > n then .[:n] + "…" else . end;
            def section(t): {type: "section", text: {type: "mrkdwn", text: t}};
            def name: (if .suite == "" then "" else "*\(.suite | esc)* — " end) + (.test | esc);
            # Capped at 10 so a mass failure stays readable.
            def list(heading; line):
              if length == 0 then []
              else [section("*\(heading)*\n" + (.[:10] | map("- " + line) | join("\n"))
                      + (if length > 10 then "\n…and \(length - 10) more in the report" else "" end))]
              end;

            ($status == "failure") as $failed
            | ($s.failures // []) as $f
            | ($s.flaky // []) as $k
            | (if $s == null then []
               else ["Branch: `\($ref)`", "Triggered by: \($actor)", "Total tests: \($s.totalTests)",
                     "Total passed: \($s.totalPassed // ($s.totalTests - $s.totalFailed))"] end) as $stats
            | (if $failed then "❌ Component tests failed" else "⚠️ Flaky component tests" end) as $title
            | {
                attachments: [{
                  fallback: "\($title) on \($ref)",
                  # The red and yellow Slack uses for its own alerts.
                  color: (if $failed then "#E01E5A" else "#ECB22E" end),
                  blocks: (
                    [ {type: "header", text: {type: "plain_text", text: $title, emoji: true}} ]
                    + (if $s == null
                     then [section("*No tests ran*\nBranch: `\($ref)`\nTriggered by: \($actor)\nInstall, typecheck or bundling failed before the suite started.")]
                     elif $failed
                     then [section((["*Total failed: \($s.totalFailed)*"] + $stats
                                    + (if ($k | length) > 0 then ["Flaky: \($k | length)"] else [] end)) | join("\n"))]
                     else [section((["*Flaky tests: \($k | length)*"] + $stats) | join("\n"))]
                     end)
                    + ($f | list("Failed tests"; "\(name)  _(\(.spec))_"))
                    # A flaky test passed on its last attempt, so `attempts` is
                    # the attempt it passed on.
                    + ($k | list("Flaky tests"; "\(name)  _(\(.spec) · passed on attempt \(.attempts))_"))
                    + [ {type: "actions", elements: [
                          {type: "button", text: {type: "plain_text", text: "Test report"}, url: $run_url}]},
                        {type: "context", elements: [
                          {type: "mrkdwn", text: "Commit <\($commit_url)|`\($sha)`> \($subject | clip(60) | esc)"}]} ]
                  )
                }]
              }' > slack-payload.json
          echo "send=true" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.slack.outputs.send == 'true' }}
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack-payload.json
