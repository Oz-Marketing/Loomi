name: Component tests

# Cypress component suite — one React component at a time, in real Chrome.
# Runbook: docs/component-testing.md.
#
# Deliberately NOT a deploy gate, for the same reason as e2e.yml: branch
# protection requires `verify` (typecheck.yml) and nothing else. No server,
# no database, no build — the suite bundles only the components it mounts.
on:
  pull_request:
  # Pushes to main run too, so a regression that lands there reaches Slack.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: component-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Installs dependencies AND caches the Cypress browser binary. Like
      # e2e.yml, this is one of the only jobs that needs the binary, so it
      # does NOT set CYPRESS_INSTALL_BINARY=0.
      - name: Install dependencies
        uses: cypress-io/github-action@v6
        with:
          runTests: false
          # The repo's peer tree needs this flag — a bare `npm ci` fails.
          install-command: npm ci --legacy-peer-deps

      - name: Typecheck the Cypress suites
        # cypress/ is outside the root tsconfig, so `npm run verify` never
        # sees these specs.
        run: npm run verify:e2e

      - name: Run the suite
        uses: cypress-io/github-action@v6
        with:
          install: false
          component: true
          browser: chrome

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Slack message
        if: failure() && github.ref == 'refs/heads/main'
        env:
          SUMMARY: cypress/results/component-summary.json
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # cypress.config.ts writes the summary after the run. No file means
          # the job failed before any test ran (install, typecheck, bundling).
          summary=null
          if [ -f "$SUMMARY" ]; then summary="$(cat "$SUMMARY")"; fi

          # Laid out like Cypress's own Slack reporter: one plain line above
          # the card saying what happened and who triggered it, then a red
          # card with stacked "Label: value" lines, the failed tests as a
          # list, and a Test report button. The line above doubles as the
          # notification text.
          jq -n \
            --argjson s "$summary" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg sha "${GITHUB_SHA::7}" \
            --arg subject "$(git log -1 --format=%s)" \
            --arg actor "$GITHUB_ACTOR" \
            --arg commit_url "$COMMIT_URL" \
            --arg run_url "$RUN_URL" '
            # mrkdwn treats &, < and > as markup.
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            def clip(n): if length > n then .[:n] + "…" else . end;
            def section(t): {type: "section", text: {type: "mrkdwn", text: t}};
            def failure: (if .suite == "" then "" else "*\(.suite | esc)* — " end)
                         + "\(.test | esc)  _(\(.spec))_";

            ($s.failures // []) as $f
            | {
                text: "*Component tests failed* on `\($ref)`. This run was triggered by \($actor).",
                attachments: [{
                  color: "#E01E5A",
                  blocks: (
                    (if $s == null
                     then [section("*No tests ran*\nBranch: `\($ref)`\nInstall, typecheck or bundling failed before the suite started.")]
                     else [section("*Total failed: \($s.totalFailed)*\nBranch: `\($ref)`\nTotal tests: \($s.totalTests)\nTotal passed: \($s.totalPassed // ($s.totalTests - $s.totalFailed))")]
                     end)
                    + (if ($f | length) > 0
                       # Capped at 10 so a mass failure stays readable.
                       then [section("*Failed tests*\n" + ($f[:10] | map("- " + failure) | join("\n"))
                               + (if ($f | length) > 10 then "\n…and \(($f | length) - 10) more in the report" else "" end))]
                       else [] end)
                    + [ {type: "actions", elements: [
                          {type: "button", text: {type: "plain_text", text: "Test report"}, url: $run_url}]},
                        {type: "context", elements: [
                          {type: "mrkdwn", text: "Commit <\($commit_url)|`\($sha)`> \($subject | clip(60) | esc)"}]} ]
                  )
                }]
              }' > slack-payload.json

      - name: Notify Slack
        if: failure() && github.ref == 'refs/heads/main'
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack-payload.json
