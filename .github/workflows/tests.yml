name: Component tests

# Cypress component suite — one React component at a time, in real Chrome.
# Runbook: docs/component-testing.md.
#
# Deliberately NOT a deploy gate, for the same reason as e2e.yml: branch
# protection requires `verify` (typecheck.yml) and nothing else. No server,
# no database, no build — the suite bundles only the components it mounts.
on:
  pull_request:
  # Pushes to main run too, so a regression that lands there reaches Slack.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: component-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Installs dependencies AND caches the Cypress browser binary. Like
      # e2e.yml, this is one of the only jobs that needs the binary, so it
      # does NOT set CYPRESS_INSTALL_BINARY=0.
      - name: Install dependencies
        uses: cypress-io/github-action@v6
        with:
          runTests: false
          # The repo's peer tree needs this flag — a bare `npm ci` fails.
          install-command: npm ci --legacy-peer-deps

      - name: Typecheck the Cypress suites
        # cypress/ is outside the root tsconfig, so `npm run verify` never
        # sees these specs.
        run: npm run verify:e2e

      - name: Run the suite
        uses: cypress-io/github-action@v6
        with:
          install: false
          component: true
          browser: chrome

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Slack message
        if: failure() && github.ref == 'refs/heads/main'
        env:
          SUMMARY: cypress/results/component-summary.json
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # cypress.config.ts writes the summary after the run. No file means
          # the job failed before any test ran (install, typecheck, bundling).
          summary=null
          if [ -f "$SUMMARY" ]; then summary="$(cat "$SUMMARY")"; fi

          # Block Kit: a header, one block pair per failed test (name first,
          # file path small underneath), and a commit footer with a button.
          # `text` is the plain fallback that notifications and previews show.
          jq -n \
            --argjson s "$summary" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg sha "${GITHUB_SHA::7}" \
            --arg subject "$(git log -1 --format=%s)" \
            --arg actor "$GITHUB_ACTOR" \
            --arg commit_url "$COMMIT_URL" \
            --arg run_url "$RUN_URL" '
            # mrkdwn treats &, < and > as markup.
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            def section(t): {type: "section", text: {type: "mrkdwn", text: t}};
            def context(t): {type: "context", elements: [{type: "mrkdwn", text: t}]};
            def failure: if .suite == "" then "*\(.test | esc)*"
                         else "*\(.suite | esc)* — \(.test | esc)" end;

            (if $s == null then "The job failed before any test ran"
             else "\($s.totalFailed) of \($s.totalTests) tests failed" end) as $status
            | ($s.failures // []) as $f
            | {
                text: "❌ Component tests failed on \($ref): \($status)",
                blocks: (
                  [ {type: "header", text: {type: "plain_text", text: "❌ Component tests failed on \($ref)", emoji: true}},
                    context($status),
                    {type: "divider"} ]
                  + (if ($f | length) > 0
                     # Capped at 10 so a mass failure stays readable.
                     then ($f[:10] | map(section(failure), context("`\(.spec)`")))
                          + (if ($f | length) > 10 then [context("…and \(($f | length) - 10) more in the run")] else [] end)
                     else [section("No test results. Install, typecheck or bundling failed. See the run log.")]
                     end)
                  + [ {type: "divider"},
                      {type: "section",
                       text: {type: "mrkdwn", text: "<\($commit_url)|`\($sha)`> · \($subject | esc) · \($actor)"},
                       accessory: {type: "button", text: {type: "plain_text", text: "View run"}, url: $run_url}} ]
                )
              }' > slack-payload.json

      - name: Notify Slack
        if: failure() && github.ref == 'refs/heads/main'
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack-payload.json
