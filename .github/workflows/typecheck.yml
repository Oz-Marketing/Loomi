name: Typecheck

on:
  pull_request:
  push:
    branches:
      - main
      # staging too. Pushes here often go direct rather than through a PR, so
      # without this nothing type-checks them: four TS6133 errors rode into
      # staging unnoticed and only surfaced against the next staging → main PR,
      # where verify is a required check.
      #
      # This REPORTS, it does not gate. Deploy to Staging is a separate workflow
      # triggered by the same push, so a red typecheck will not stop a deploy —
      # it just means someone finds out now instead of at merge time.
      - staging

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/loomi_test?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loomi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d loomi_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push Prisma schema
        run: npx prisma db push

      - name: Run verification gate
        run: npm run verify

      - name: Run tests
        run: npm run test
