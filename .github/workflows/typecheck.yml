name: Typecheck

on:
  # KEEP THIS. Branch protection on main and staging requires a check literally
  # named `verify`, which is this job running standalone on a PR. If this trigger
  # goes away, that required check never reports and every PR blocks forever.
  pull_request:

  # Called by deploy.yml and deploy-staging.yml so the same definition both runs
  # and GATES the deploy — see the `verify` job in each.
  #
  # Deliberately no `push:` trigger. It used to run on pushes to main (and
  # briefly staging), but that only ever reported: the deploy workflows fire on
  # the same event and never looked at the result, so a red typecheck deployed
  # anyway. Being called by them replaces that, without running twice per push.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/loomi_test?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loomi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d loomi_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push Prisma schema
        run: npx prisma db push

      - name: Run verification gate
        run: npm run verify

      - name: Run tests
        run: npm run test
