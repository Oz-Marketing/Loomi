<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Loomi">
  <!--
    App icon. The "loomi studio" wordmark is a ~5:1 horizontal lockup, so it
    cannot be a square icon at any size. This is its reduction: the first
    letterform in the same rounded-geometric style, plus the dot that sits over
    the "i" in the wordmark and is the mark's one piece of color.

    Indigo is the `primary` token from globals.css rather than the #4f7abd in
    the logo PNG. The app already recolors that accent to `primary` everywhere
    it draws the wordmark itself (see the reporting sidebar's "loomi
    reporting"), so this matches what the product actually looks like.

    Solid tile + white glyph so it holds up against both light and dark browser
    chrome, where a transparent mark would disappear into one of them.

    NOTE: no double hyphen anywhere in this comment. It is illegal inside an XML
    comment and silently breaks the file for strict parsers (sharp, rsvg).
  -->
  <rect width="512" height="512" rx="114" fill="#6366f1"/>
  <path d="M182 122 V 380" fill="none" stroke="#ffffff" stroke-width="58" stroke-linecap="round"/>
  <circle cx="322" cy="152" r="38" fill="#ffffff"/>
</svg>
